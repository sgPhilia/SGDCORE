name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Release, Debug]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DSGDCORE_BUILD_TESTS=ON -DSGDCORE_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} -j 2

      - name: Test
        run: ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}

      - name: Install package
        run: cmake --install build --config ${{ matrix.build_type }} --prefix ${{ github.workspace }}/install

      - name: Configure installed-package consumer
        run: cmake -B package-consumer-build -S tests/package_consumer -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install

      - name: Build installed-package consumer
        run: cmake --build package-consumer-build --config ${{ matrix.build_type }} -j 2

      - name: Test installed-package consumer
        run: ctest --test-dir package-consumer-build --output-on-failure -C ${{ matrix.build_type }}
